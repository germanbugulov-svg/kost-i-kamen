/* Layout: full-screen first-person canvas; carved-stone HUD on top, stone keypad docked at the bottom (right side in landscape) */
:root{color-scheme:dark;
  --bone:#f3e7cc;--ochre:#e0a64e;--clay:#c2552f;--moss:#8bc34a;--char:#1a120c;--blood:#d6283a;--stone:#4a3a2c;--stone2:#2e231a;
  --display:'Ruslan Display','Rubik',Georgia,serif;--ui:'Rubik',system-ui,sans-serif;
  --cell:min(76px,calc((100vw - 64px)/4.6),calc((40vh - 40px)/3));
  --cell:min(76px,calc((100vw - 64px)/4.6),calc((40dvh - 40px)/3))}
body.land{--cell:min(66px,calc((100vh - 40px)/3.6),calc((50vw - 60px)/4.6));--cell:min(66px,calc((100dvh - 40px)/3.6),calc((50vw - 60px)/4.6))}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--char);overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--ui);color:var(--bone)}
body{position:fixed;inset:0}
canvas{position:fixed;inset:0;display:block}
button{font-family:inherit;color:var(--bone);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
svg{display:block}

#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left));display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
.bars{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;max-width:260px}
.lbl{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--bone);opacity:.85;margin-bottom:3px;text-shadow:0 1px 2px #000}
.hp{display:flex;gap:4px}
.hp i{flex:1;height:14px;border:2px solid rgba(0,0,0,.55);border-radius:4px 2px 5px 3px;background:rgba(26,18,12,.6);transition:.25s}
.hp i.on{background:linear-gradient(#a6dc62,#5f9a2c);box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
.hp.low i.on{background:linear-gradient(#ff5a5a,#a3141f)}
.rbar{display:flex;gap:4px}
.rbar i{flex:1;height:8px;border:2px solid rgba(0,0,0,.55);border-radius:3px;background:rgba(26,18,12,.6);transition:.25s}
.rbar i.on{background:linear-gradient(#f2b45a,#c2552f)}
.rbar.full i{background:linear-gradient(#ffe08a,#ff6a1f);box-shadow:0 0 10px #ff7a2a}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#counter{font-size:16px;font-weight:900;letter-spacing:1px;color:var(--bone);text-shadow:0 2px 3px #000;white-space:nowrap;font-variant-numeric:tabular-nums}
#mute{pointer-events:auto;background:rgba(26,18,12,.55);border:2px solid rgba(0,0,0,.5);border-radius:8px;width:38px;height:32px;display:flex;align-items:center;justify-content:center;padding:0}
#mute svg{width:20px;height:20px}
#mute .x{display:none}
#mute.off .x{display:block}
#mute.off .w{display:none}

#msg{position:fixed;left:0;right:0;text-align:center;font-family:var(--display);font-size:clamp(30px,9vw,56px);letter-spacing:1px;pointer-events:none;opacity:0;white-space:nowrap}
#msg.show{animation:pop .95s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6) rotate(-4deg)}15%{opacity:1;transform:scale(1.1) rotate(1deg)}30%{transform:scale(1) rotate(0)}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);padding:7px 14px;border:2px solid rgba(0,0,0,.5);color:var(--char);background:var(--ochre);border-radius:6px 3px 7px 4px;font-size:13px;font-weight:900;letter-spacing:2px;box-shadow:0 3px 10px rgba(0,0,0,.5);opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#hint{position:fixed;left:0;right:0;text-align:center;font-size:14px;font-weight:700;letter-spacing:1px;color:var(--bone);text-shadow:0 1px 3px #000,0 0 10px #000;pointer-events:none;padding:0 10px}

#controls{position:fixed;left:0;right:0;bottom:0;padding:14px 10px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(rgba(26,18,12,0),rgba(26,18,12,.85) 22%,rgba(20,14,9,.95));transition:opacity .2s}
body.land #controls{left:auto;right:calc(12px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));background:none;padding:0}
body.busy #controls .pad,body.busy #rage,body.busy #med{opacity:.5;pointer-events:none}
body.rage #controls,body.screen #controls{display:none}
.pad{width:calc(var(--cell)*3 + 16px)}
#grid{display:grid;grid-template-columns:repeat(3,var(--cell));gap:8px}
.stone{background:linear-gradient(160deg,#6b5642,var(--stone) 45%,var(--stone2));border:2px solid rgba(0,0,0,.6);box-shadow:inset 0 2px 0 rgba(255,230,190,.22),inset 0 -4px 0 rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.55);transition:background .15s,transform .08s}
.k{width:var(--cell);height:var(--cell);border-radius:13px 8px 15px 9px;font-family:var(--display);font-size:calc(var(--cell)*.4);position:relative;padding:0;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.k:nth-child(2n){border-radius:9px 14px 8px 13px}
.k:nth-child(3n){border-radius:14px 10px 12px 7px}
.k:active{transform:scale(.94)}
.k small{position:absolute;right:6px;bottom:3px;font-family:var(--ui);font-weight:900;font-size:14px;color:var(--ochre)}
.k.good,.r.good{background:linear-gradient(#9ccf5a,#4f7f25)}
.k.bad,.r.bad{background:linear-gradient(#e0454f,#8a1420)}
#rows{display:none;flex-direction:column;gap:8px}
body.defend #grid{display:none}
body.defend #rows{display:flex}
.r{height:var(--cell);border-radius:12px 8px 14px 9px;font-size:17px;font-weight:900;letter-spacing:2px;background:linear-gradient(160deg,#8a4a2e,#5e2f1c 50%,#3d1e12)}
.r:active{transform:scale(.97)}
.side{width:calc(var(--cell)*.82);height:calc(var(--cell)*.82);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:none;padding:0;position:relative}
.side svg{width:calc(var(--cell)*.32);height:calc(var(--cell)*.32)}
.side span{font-size:8px;font-weight:900;letter-spacing:.5px}
#med{color:#b9e27e}
#med em{position:absolute;top:-4px;right:-4px;background:var(--moss);color:var(--char);font-style:normal;font-weight:900;font-size:12px;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(0,0,0,.5)}
#med.none{opacity:.4}
#rage{color:rgba(243,231,204,.45)}
#rage.ready{color:#fff;background:radial-gradient(circle at 50% 60%,#ffcf6a,#e8641f 55%,#8a2410);animation:fire .7s ease-in-out infinite alternate}
@keyframes fire{from{box-shadow:0 0 10px #ff8a2a,0 0 0 #ff3a1a}to{box-shadow:0 0 26px #ffb04a,0 0 46px #ff3a1a}}

#screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(26,18,12,.3),rgba(20,12,6,.9));padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
body.screen #screen{display:flex}
.panel{text-align:center;max-width:440px;width:100%;margin:auto 0}
.panel h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,12vw,68px);margin:0 0 6px;line-height:1;color:var(--bone);text-shadow:0 3px 0 #6b3a1c,0 6px 0 #2a160a,0 0 30px rgba(255,140,60,.5);letter-spacing:1px;text-wrap:balance}
.panel h2{font-size:14px;font-weight:900;margin:0 0 26px;color:var(--ochre);letter-spacing:3px;text-shadow:0 2px 3px #000}
.panel p{font-size:14px;line-height:1.5;color:#e6d8bb;margin:0 0 18px}
.btn{display:block;width:100%;max-width:300px;margin:12px auto;padding:15px 10px;font-family:var(--display);font-size:22px;letter-spacing:1px;border-radius:14px 9px 16px 10px}
.btn.alt{background:linear-gradient(160deg,#8a4a2e,#5e2f1c 50%,#3d1e12)}
.btn small{display:block;font-family:var(--ui);font-weight:700;font-size:11px;opacity:.75;margin-top:4px;letter-spacing:1px}
details{font-size:13px;color:#d9cbae;text-align:left;margin:18px auto 0;max-width:340px;line-height:1.5}
summary{cursor:pointer;text-align:center;font-weight:900;letter-spacing:2px;color:var(--ochre)}
details ul{padding-left:18px}
.panel p.inst{font-size:12px;color:#b8a888;margin:18px auto 0;max-width:320px}
.panel p.inst b{color:var(--ochre)}
@media (prefers-reduced-motion:reduce){#msg.show{animation-duration:1.4s}#rage.ready{animation:none;box-shadow:0 0 18px #ff8a2a}}
</style>
</head>

    <div><div class="lbl">ЖИЗНЬ</div><div id="hp" class="hp"><i class="on"></i><i class="on"></i><i class="on"></i></div></div>
    <div><div class="lbl">ЯРОСТЬ</div><div id="rbar" class="rbar"><i></i><i></i><i></i><i></i></div></div>

    <div id="counter">☠ 0/10</div>
    <button id="mute" title="Звук" aria-label="Звук"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" fill-opacity=".3"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M17 9l5 6M22 9l-5 6"/></svg></button>

<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const R=Math.random,ri=n=>Math.floor(R()*n);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,easeOut=t=>1-Math.pow(1-t,3);
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function hash1(i,s){let h=Math.imul(i^0x9e3779b9,0x85ebca6b)^Math.imul(s+1,0xc2b2ae35);h^=h>>>13;h=Math.imul(h,0x27d4eb2f);h^=h>>>16;return(h>>>0)/4294967296}
function vn(x,s){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash1(i,s),hash1(i+1,s),u)}
function hexRgb(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
function shade(hex,a){const c=hexRgb(hex),f=a<0?0:255,t=Math.abs(a);return`rgb(${lerp(c[0],f,t)|0},${lerp(c[1],f,t)|0},${lerp(c[2],f,t)|0})`}

// ---------- constants ----------
const CAMH=1.6,FIGHT_Z=3.2,ST=3.0,PW=1.15,SEG=6,STEP=2,FAR=70,TOTAL=10,RAGE_MAX=4,SAVE_KEY='stoneage_save_v1',MUTE_KEY='stoneage_mute';
const FOG=[226,158,112];
const ZX=[-0.32,0,0.32],ZY=[-1.55,-1.18,-0.75];
const ROWNAME=['ВЕРХ','СЕРЕДИНА','НИЗ'];
const DIRS={1:[1,1],2:[0,1],3:[-1,1],4:[1,0],5:[0,0],6:[-1,0],7:[1,-1],8:[0,-1],9:[-1,-1]};
const ARROWS={1:'↘',2:'↓',3:'↙',4:'→',5:'•',6:'←',7:'↗',8:'↑',9:'↖'};
// c = war paint, skin, mammoth fur, hair style, weapon
const TYPES=[
 {c:'#e0a64e',skin:'#a8693f',fur:'#6b4a2e',hair:'wild',weap:'club',k:1},
 {c:'#c2552f',skin:'#8c5634',fur:'#5a3d26',hair:'bun',weap:'axe',k:1},
 {c:'#efe6cf',skin:'#b97a50',fur:'#7a5634',hair:'bald',weap:'club',k:1},
 {c:'#e0a64e',skin:'#7a4a2c',fur:'#4e3524',hair:'wild',weap:'axe',k:1.01},
 {c:'#efe6cf',skin:'#9a6040',fur:'#6e4c30',hair:'bun',weap:'club',k:1.01},
 {c:'#c2552f',skin:'#a36a45',fur:'#584030',hair:'skull',weap:'axe',k:1.02},
 {c:'#efe6cf',skin:'#86502f',fur:'#7a5634',hair:'wild',weap:'club',k:1.03},
 {c:'#e0a64e',skin:'#b07048',fur:'#4a3322',hair:'skull',weap:'axe',k:1.04},
 {c:'#c2552f',skin:'#94593a',fur:'#65452b',hair:'bald',weap:'club',k:1.05},
 {c:'#c2552f',skin:'#9a5e3c',fur:'#3e2a1c',hair:'boss',weap:'axe',k:1.15,boss:true}];
TYPES.forEach(t=>{t.skinD=shade(t.skin,-0.18);t.skinDD=shade(t.skin,-0.35);t.skinL=shade(t.skin,0.18);t.furD=shade(t.fur,-0.4);t.furL=shade(t.fur,0.28)});
const zonePt=n=>({x:ZX[(n-1)%3],y:ZY[Math.floor((n-1)/3)]});
function dirOf(n){const d=DIRS[n],l=Math.hypot(d[0],d[1])||1;return{x:d[0]/l,y:d[1]/l}}

// gorge geometry: walls wander in and lean outward as they rise
function wallX(z,side,y){return side*(ST+0.85*vn(z/7,side>0?11:23)+0.3*vn(z/2.2,side>0?37:41)+y*0.32)}
function wallTop(z,side){return 10+9*vn(z/10,side>0?53:59)+2.5*vn(z/2.5,side>0?61:67)}
function pathX(z){return(vn(z/6,71)-0.5)*0.5}

// ---------- layout ----------
let W,H,DPR,viewH,horizon0,F,cx,land,hz,bg,vign,dprCap=2,volc={x:0,y:0},sun={x:0,y:0,r:0};
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,dprCap);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  land=W>H*1.05;document.body.classList.toggle('land',land);
  const c=$('controls');const wasHidden=getComputedStyle(c).display==='none';
  if(wasHidden)c.style.display='flex';
  const ch=land?0:c.getBoundingClientRect().height;
  if(wasHidden)c.style.display='';
  viewH=land?H:Math.max(H-ch*0.9,H*0.5);
  horizon0=viewH*0.4;
  F=0.5*viewH*FIGHT_Z/1.8;
  if(land)F=Math.min(F,W*0.5*FIGHT_Z/1.8);
  cx=land?W*0.44:W/2;
  $('msg').style.top=(viewH*0.22)+'px';
  $('hint').style.top=(viewH-34)+'px';
  $('hint').style.right=land?(W-cx*2)+'px':'0';
  buildBg();buildVignette();
}

// ---------- prerendered sprites ----------
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
const PX=80; // sprite pixels per meter
const FOGLV=[0,0.3,0.58,0.82];
function sprite(wm,hm,draw){const c=mk(wm*PX,hm*PX),g=c.getContext('2d');g.lineCap='round';g.lineJoin='round';draw(g,c.width,c.height);
  const v=FOGLV.map(k=>{if(!k)return c;const t=mk(c.width,c.height),tg=t.getContext('2d');tg.drawImage(c,0,0);tg.globalCompositeOperation='source-atop';tg.fillStyle=`rgba(${FOG},${k})`;tg.fillRect(0,0,t.width,t.height);return t});
  return{v,w:wm,h:hm}}
const SP={palmR:[],palmL:[],bush:[],fern:[],rock:[],tuft:[],skull:null};
function drawPalm(g,w,h,lean,r){
  const p0={x:w/2,y:h},p2={x:w/2+lean*w*0.26,y:h*0.2},p1={x:w/2+lean*w*0.02,y:h*0.62};
  const B=t=>({x:(1-t)*(1-t)*p0.x+2*(1-t)*t*p1.x+t*t*p2.x,y:(1-t)*(1-t)*p0.y+2*(1-t)*t*p1.y+t*t*p2.y});
  const N=24;
  for(let i=0;i<N;i++){const a=B(i/N),b=B((i+1)/N),dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy),nx=-dy/l,ny=dx/l;
    const wa=lerp(h*0.034,h*0.02,i/N),wb=lerp(h*0.034,h*0.02,(i+1)/N);
    g.fillStyle=i%2?'#5c3f27':'#6e4c2f';g.beginPath();g.moveTo(a.x+nx*wa,a.y+ny*wa);g.lineTo(b.x+nx*wb*1.08,b.y+ny*wb*1.08);g.lineTo(b.x-nx*wb*1.08,b.y-ny*wb*1.08);g.lineTo(a.x-nx*wa,a.y-ny*wa);g.fill();
    g.strokeStyle='rgba(255,190,120,.35)';g.lineWidth=2;g.beginPath();g.moveTo(a.x-nx*wa*0.8,a.y-ny*wa*0.8);g.lineTo(b.x-nx*wb*0.8,b.y-ny*wb*0.8);g.stroke();}
  const top=p2,nf=9;
  for(let f=0;f<nf;f++){
    const ang=-Math.PI/2+(f/(nf-1)-0.5)*Math.PI*1.75+(r()-.5)*0.25,len=h*(0.22+r()*0.08);
    const ex=top.x+Math.cos(ang)*len,ey=top.y+Math.sin(ang)*len*0.55+len*0.42;
    const qx=top.x+Math.cos(ang)*len*0.55,qy=top.y+Math.sin(ang)*len*0.6-len*0.12;
    const col=f%3===0?'#4f7a2c':f%2?'#355d22':'#2a4c1b';
    for(let t=0.08;t<=1;t+=0.055){
      const x=(1-t)*(1-t)*top.x+2*(1-t)*t*qx+t*t*ex,y=(1-t)*(1-t)*top.y+2*(1-t)*t*qy+t*t*ey;
      const tx=2*(1-t)*(qx-top.x)+2*t*(ex-qx),ty=2*(1-t)*(qy-top.y)+2*t*(ey-qy),tl=Math.hypot(tx,ty);
      const nx=-ty/tl,ny=tx/tl,ll=len*0.24*(1-t*0.55);
      g.strokeStyle=col;g.lineWidth=Math.max(2,h*0.007);
      g.beginPath();g.moveTo(x,y);g.lineTo(x+nx*ll+tx/tl*ll*0.3,y+ny*ll+ll*0.45);g.moveTo(x,y);g.lineTo(x-nx*ll+tx/tl*ll*0.3,y-ny*ll+ll*0.45);g.stroke();
    }
    g.strokeStyle='#2c3f17';g.lineWidth=h*0.008;g.beginPath();g.moveTo(top.x,top.y);g.quadraticCurveTo(qx,qy,ex,ey);g.stroke();
    g.strokeStyle='rgba(220,230,120,.35)';g.lineWidth=h*0.003;g.stroke();
  }
  g.fillStyle='#4a3018';for(let i=0;i<3;i++){g.beginPath();g.arc(top.x+(i-1)*h*0.022,top.y+h*0.025+(i%2)*h*0.01,h*0.017,0,7);g.fill()}
}
function drawBush(g,w,h,r,tone){
  const greens=tone?['#2f5420','#3d6a28','#4d7d30','#6d9a3c']:['#2b4a1e','#365c24','#456f2c','#80a548'];
  for(let i=0;i<150;i++){
    const u=r()*2-1,x=w/2+u*w*0.46,top=h*(1-0.92*Math.sqrt(Math.max(0,1-u*u))),y=lerp(h,top,Math.pow(r(),0.6));
    const lvl=1-(y-top)/(h-top+1);g.fillStyle=greens[Math.min(3,Math.floor(lvl*3.2+r()*0.8))];
    g.save();g.translate(x,y);g.rotate(r()*Math.PI);g.beginPath();g.ellipse(0,0,w*0.035+r()*w*0.03,w*0.015+r()*w*0.012,0,0,7);g.fill();g.restore();
  }
  if(r()<.5){g.fillStyle='#c2552f';for(let i=0;i<8;i++){g.beginPath();g.arc(w*0.2+r()*w*0.6,h*0.3+r()*h*0.5,w*0.012,0,7);g.fill()}}
}
function drawFern(g,w,h,r){
  for(let f=0;f<8;f++){
    const a=-Math.PI/2+(f/7-0.5)*2.4,len=h*(0.75+r()*0.3),bx=w/2,by=h;
    const ex=bx+Math.cos(a)*len*0.9,ey=by+Math.sin(a)*len*0.55+len*0.25,qx=bx+Math.cos(a)*len*0.45,qy=by+Math.sin(a)*len*0.8;
    g.strokeStyle=f%2?'#3d6a28':'#4f7f2e';g.lineWidth=2.5;
    for(let t=0.1;t<1;t+=0.07){const x=(1-t)*(1-t)*bx+2*(1-t)*t*qx+t*t*ex,y=(1-t)*(1-t)*by+2*(1-t)*t*qy+t*t*ey,l=len*0.13*(1-t*0.7);
      g.beginPath();g.moveTo(x,y);g.lineTo(x-l*0.6,y-l*0.5);g.moveTo(x,y);g.lineTo(x+l*0.6,y-l*0.4);g.stroke()}
    g.strokeStyle='#2c4a1a';g.lineWidth=2;g.beginPath();g.moveTo(bx,by);g.quadraticCurveTo(qx,qy,ex,ey);g.stroke();
  }
}
function drawRock(g,w,h,r){
  const pts=[];for(let i=0;i<11;i++){const a=Math.PI+i/10*Math.PI,rr=0.82+r()*0.18;pts.push([w/2+Math.cos(a)*w*0.47*rr,h-Math.abs(Math.sin(a))*h*0.92*rr])}
  const gr=g.createLinearGradient(w*0.2,0,w*0.8,h);gr.addColorStop(0,'#a08a72');gr.addColorStop(.5,'#6e5c4a');gr.addColorStop(1,'#3a2e24');
  g.fillStyle=gr;g.beginPath();g.moveTo(pts[0][0],h);pts.forEach(p=>g.lineTo(p[0],p[1]));g.lineTo(pts[10][0],h);g.closePath();g.fill();
  g.strokeStyle='rgba(30,20,12,.5)';g.lineWidth=2;for(let i=0;i<4;i++){const x=w*(0.25+r()*0.5);g.beginPath();g.moveTo(x,h*(0.3+r()*0.2));g.lineTo(x+(r()-.5)*w*0.2,h*(0.6+r()*0.3));g.stroke()}
  g.fillStyle='rgba(110,140,50,.75)';for(let i=0;i<14;i++){const p=pts[2+ri(7)];g.beginPath();g.arc(p[0]+(r()-.5)*w*0.1,p[1]+r()*h*0.08,w*0.03,0,7);g.fill()}
}
function drawTuft(g,w,h,r){
  for(let i=0;i<11;i++){const x=w*(0.2+r()*0.6),l=h*(0.5+r()*0.5),lean=(r()-.5)*w*0.5;
    g.strokeStyle=r()<.5?'#5a7a2a':'#8a9a3a';g.lineWidth=2;g.beginPath();g.moveTo(x,h);g.quadraticCurveTo(x+lean*0.3,h-l*0.6,x+lean,h-l);g.stroke()}
}
function drawSkull(g,w,h){
  g.fillStyle='#d9ccb0';g.beginPath();g.ellipse(w/2,h*0.62,w*0.2,h*0.36,0,0,7);g.fill();
  g.fillStyle='#b8a888';g.beginPath();g.ellipse(w/2,h*0.85,w*0.14,h*0.15,0,0,7);g.fill();
  g.fillStyle='#2a1c12';g.beginPath();g.ellipse(w*0.43,h*0.58,w*0.035,h*0.07,0.3,0,7);g.ellipse(w*0.57,h*0.58,w*0.035,h*0.07,-0.3,0,7);g.fill();
  for(const s of[-1,1]){g.strokeStyle='#efe4cc';g.lineWidth=h*0.09;g.beginPath();g.moveTo(w/2+s*w*0.1,h*0.8);g.bezierCurveTo(w/2+s*w*0.3,h*1.0,w/2+s*w*0.48,h*0.7,w/2+s*w*0.4,h*0.25);g.stroke();
    g.strokeStyle='rgba(120,100,70,.5)';g.lineWidth=h*0.025;g.stroke()}
}
function buildSprites(){
  for(let i=0;i<2;i++){SP.palmR.push(sprite(4.4,6.6,(g,w,h)=>drawPalm(g,w,h,1,rng(100+i))));SP.palmL.push(sprite(4.4,6.6,(g,w,h)=>drawPalm(g,w,h,-1,rng(200+i))))}
  for(let i=0;i<3;i++)SP.bush.push(sprite(1.9,1.3,(g,w,h)=>drawBush(g,w,h,rng(300+i),i%2)));
  for(let i=0;i<2;i++)SP.fern.push(sprite(1.5,1.0,(g,w,h)=>drawFern(g,w,h,rng(400+i))));
  for(let i=0;i<3;i++)SP.rock.push(sprite(1.5,1.0,(g,w,h)=>drawRock(g,w,h,rng(500+i))));
  for(let i=0;i<2;i++)SP.tuft.push(sprite(0.6,0.4,(g,w,h)=>drawTuft(g,w,h,rng(600+i))));
  SP.skull=sprite(2.2,1.3,(g,w,h)=>drawSkull(g,w,h));
}

// ---------- far background: sunset sky, ridges, volcano, mammoths ----------
function buildBg(){
  const h=Math.ceil(horizon0+60);bg=mk(W*DPR,h*DPR);const g=bg.getContext('2d');g.scale(DPR,DPR);
  const base=horizon0,u=horizon0;
  const sky=g.createLinearGradient(0,0,0,base);sky.addColorStop(0,'#24304f');sky.addColorStop(.35,'#6b4a6c');sky.addColorStop(.7,'#d9774f');sky.addColorStop(1,'#ffcf8c');
  g.fillStyle=sky;g.fillRect(0,0,W,h);
  sun.x=cx-u*0.42;sun.y=base-u*0.3;sun.r=u*0.085;
  const sg=g.createRadialGradient(sun.x,sun.y,sun.r*0.6,sun.x,sun.y,u*1.1);sg.addColorStop(0,'rgba(255,235,170,.9)');sg.addColorStop(.15,'rgba(255,190,110,.45)');sg.addColorStop(1,'rgba(255,150,90,0)');
  g.fillStyle=sg;g.fillRect(0,0,W,h);
  g.fillStyle='#fff3cf';g.beginPath();g.arc(sun.x,sun.y,sun.r,0,7);g.fill();
  const r=rng(4242);
  // long streaky clouds lit from below
  for(let i=0;i<7;i++){const y=u*(0.1+r()*0.45),x=r()*W,cw=u*(0.5+r()*0.9),chh=u*(0.025+r()*0.03);
    const cg=g.createLinearGradient(0,y-chh,0,y+chh);cg.addColorStop(0,'rgba(120,80,110,.55)');cg.addColorStop(1,'rgba(255,170,110,.7)');
    g.fillStyle=cg;g.beginPath();g.ellipse(x,y,cw/2,chh,0,0,7);g.fill();g.beginPath();g.ellipse(x+cw*0.2,y-chh*0.5,cw/3,chh*0.8,0,0,7);g.fill()}
  // ridge layers
  const ridge=(amp,lift,col,seed)=>{const rr=rng(seed),f1=0.004+rr()*0.004,f2=0.015+rr()*0.01,p1=rr()*9,p2=rr()*9;
    const Y=x=>base-lift-amp*(0.55+0.3*Math.sin(x*f1/(u/200)+p1)+0.15*Math.sin(x*f2/(u/200)+p2));
    g.fillStyle=col;g.beginPath();g.moveTo(0,h);for(let x=0;x<=W+6;x+=5)g.lineTo(x,Y(x)+(rr()-.5)*u*0.012);g.lineTo(W,h);g.fill();return Y};
  ridge(u*0.34,u*0.02,'#8a6a86',11);
  // volcano
  const vx=cx+u*0.1,vh=u*0.62,vw=u*1.15;volc.x=vx;volc.y=base-vh+u*0.02;
  const vg=g.createLinearGradient(0,base-vh,0,base);vg.addColorStop(0,'#3e2a33');vg.addColorStop(1,'#7a5466');
  g.fillStyle=vg;g.beginPath();g.moveTo(vx-vw/2,base);g.quadraticCurveTo(vx-vw*0.2,base-vh*0.5,vx-vw*0.09,base-vh);g.lineTo(vx-vw*0.03,base-vh+u*0.025);g.lineTo(vx+vw*0.04,base-vh+u*0.02);g.lineTo(vx+vw*0.09,base-vh*0.99);g.quadraticCurveTo(vx+vw*0.22,base-vh*0.5,vx+vw/2,base);g.fill();
  const lg=g.createRadialGradient(vx,base-vh,1,vx,base-vh,u*0.16);lg.addColorStop(0,'rgba(255,150,50,.95)');lg.addColorStop(1,'rgba(255,80,30,0)');g.fillStyle=lg;g.fillRect(vx-u*0.2,base-vh-u*0.2,u*0.4,u*0.4);
  g.save();g.shadowColor='#ff6a1a';g.shadowBlur=8;g.strokeStyle='#ff8a2a';g.lineWidth=Math.max(1.2,u*0.008);
  for(const s of[-1,0.4,1]){g.beginPath();g.moveTo(vx+s*vw*0.05,base-vh+u*0.02);g.bezierCurveTo(vx+s*vw*0.08,base-vh*0.75,vx+s*vw*0.14,base-vh*0.6,vx+s*vw*0.17,base-vh*0.42);g.stroke()}
  g.restore();
  const Y2=ridge(u*0.2,-u*0.02,'#6e4c58',22);
  // mammoth herd on the near ridge
  g.fillStyle='#3a2630';
  for(let i=0;i<4;i++){const mx=cx+u*(0.55+i*0.13+(i>1?0.08:0)),my=Y2(mx)+u*0.004,s=u*0.0011*(i===2?0.7:1);
    g.beginPath();g.ellipse(mx,my-26*s,22*s,15*s,0,0,7);g.fill();g.beginPath();g.arc(mx-18*s,my-34*s,10*s,0,7);g.fill();

// ---------- world ----------
const segCache=new Map();
function seg(k){

  const add=(sp,z,side,inset,sc,x)=>s.items.push({sp,z,side,inset,sc,x});
  for(const side of[-1,1]){
    const np=r()<0.75?(r()<0.35?2:1):0;
    for(let i=0;i<np;i++){const set=side<0?SP.palmR:SP.palmL;add(set[r()*set.length|0],k*SEG+r()*SEG,side,0.3+r()*0.6,0.8+r()*0.5)}
    const nb=1+(r()*3|0);for(let i=0;i<nb;i++)add(SP.bush[r()*3|0],k*SEG+r()*SEG,side,0.15+r()*0.8,0.7+r()*0.6);
    const nf=1+(r()*2|0);for(let i=0;i<nf;i++)add(SP.fern[r()*2|0],k*SEG+r()*SEG,side,0.1+r()*0.9,0.7+r()*0.5);
    if(r()<0.45)add(SP.rock[r()*3|0],k*SEG+r()*SEG,side,0.3+r()*1.0,0.6+r()*0.9);
    if(k%5===2&&r()<0.6)add(SP.skull,k*SEG+r()*SEG,side,1.1,1.5);
  }
  const nt=4+(r()*4|0);for(let i=0;i<nt;i++)add(SP.tuft[r()*2|0],k*SEG+r()*SEG,0,0,0.7+r()*0.6,(r()<.5?-1:1)*(1.0+r()*1.4));
  segCache.set(k,s);
  if(segCache.size>60){for(const kk of segCache.keys()){if(kk<k-20||kk>k+40)segCache.delete(kk)}}
  return s;
}
function P(x,y,z){const s=F/z;return[cx+x*s,hz+(CAMH-y)*s]}
function fogK(z){return clamp((z-9)/(FAR-9),0,1)}
function fogCol(rgb,k,m=1,a=1){return`rgba(${lerp(rgb[0]*m,FOG[0],k)|0},${lerp(rgb[1]*m,FOG[1],k)|0},${lerp(rgb[2]*m,FOG[2],k)|0},${a})`}
function quad(a,b,c,d){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.closePath()}
const ROCK=[[92,60,42],[134,88,58],[116,74,50],[152,104,68],[124,82,56]];
const BANDS=[0,2.4,5,8.5,13,40];
const DIRT=[132,94,60],GRASS=[74,98,42];
function drawGroundStrip(za,zb){
  const ra=Math.max(za-camZ,0.3),rb=zb-camZ;if(rb<=0.3)return;
  const fk=fogK((ra+rb)/2),m=0.9+hash1(Math.round(za/STEP),7)*0.18,pa=pathX(za),pb=pathX(zb);
  for(const s of[-1,1]){quad(P(wallX(za,s,0)+s*0.3,0,ra),P(wallX(zb,s,0)+s*0.3,0,rb),P(pb+s*PW,0,rb),P(pa+s*PW,0,ra));ctx.fillStyle=fogCol(GRASS,fk,m*(s<0?1.08:0.85));ctx.fill()}
  quad(P(pa-PW,0,ra),P(pb-PW,0,rb),P(pb+PW,0,rb),P(pa+PW,0,ra));ctx.fillStyle=fogCol(DIRT,fk,m);ctx.fill();
  ctx.strokeStyle=fogCol([60,74,30],fk,1,0.6);ctx.lineWidth=Math.max(1,F/rb*0.04);ctx.beginPath();

}
function drawWallStrip(za,zb,side,t){
  const ra=Math.max(za-camZ,0.3),rb=zb-camZ;if(rb<=0.3)return;
  const zwa=camZ+ra,ha=wallTop(zwa,side),hb=wallTop(zb,side),fk=fogK((ra+rb)/2);

    const y1a=Math.min(BANDS[j+1],ha),y1b=Math.min(BANDS[j+1],hb);

    ctx.fillStyle=fogCol(ROCK[(j+(idx>>3))%ROCK.length],fk,light*(0.82+j*0.06));ctx.fill();

    ctx.strokeStyle=fogCol([46,82,30],fk);ctx.lineWidth=Math.max(1,s*0.06);ctx.beginPath();
    for(let k=0;k<=8;k++){const y=top-len*k/8,p=P(wallX(zv,side,y)-side*0.08+Math.sin(k*1.3+t*0.8+idx)*0.05,y,rv);k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}
    ctx.stroke();
  }
  // bushes and palms growing on the cliff top
  const hv=hash1(idx,side>0?101:103);
  if(hv<0.34)drawSpriteAt(SP.bush[idx%3],wallX((zwa+zb)/2,side,(ha+hb)/2)-side*0.2,(ha+hb)/2-0.15,(ra+rb)/2,1.3+hv*2);
  else if(hv>0.88){const set=side<0?SP.palmR:SP.palmL;drawSpriteAt(set[idx%2],wallX((zwa+zb)/2,side,(ha+hb)/2)-side*0.3,(ha+hb)/2-0.2,(ra+rb)/2,0.9)}
}
function drawSpriteAt(sp,x,y,z,sc){
  if(z<0.4||z>FAR)return;
  const s=F/z,w=sp.w*sc*s,h=sp.h*sc*s,X=cx+x*s-w/2;if(X>W||X+w<0)return;

function drawWorld(t){
  const zStart=Math.floor(camZ/STEP)*STEP,zEnd=camZ+FAR;
  const gg=ctx.createLinearGradient(0,hz,0,H);gg.addColorStop(0,`rgb(${FOG})`);gg.addColorStop(.2,'#6e5a3a');gg.addColorStop(1,'#2a1e12');
  ctx.fillStyle=gg;ctx.fillRect(0,hz,W,H-hz+20);
  for(let z=zStart;z<zEnd;z+=STEP)drawGroundStrip(z,z+STEP);
  const items=[];
  for(let z=zStart;z<zEnd;z+=STEP){items.push({k:z+STEP-camZ,a:z,side:-1});items.push({k:z+STEP-camZ,a:z,side:1})}

  if(G.enemy)items.push({k:enemyScreen(G.enemy).z-0.002,enemy:true});

// ---------- sky life: smoke, pterodactyls, drifting leaves ----------
let smoke=[],pteros=[],motes=[],smokeT=0;
function initSky(){
  pteros=[0,1,2].map(i=>({x:R()*W,y:0.45+R()*0.4,s:0.6+R()*0.6,v:(10+R()*16)*(R()<.5?1:-1),fs:5+R()*3,ph:R()*6}));
  motes=[];const n=Math.round(clamp(W*H/9000,30,90));
  for(let i=0;i<n;i++)motes.push({x:R()*W,y:R()*H,vx:(R()-.5)*12,vy:(R()-.3)*10,ph:R()*6,leaf:i%6===0,rot:R()*6,vr:(R()-.5)*3,s:1+R()*2});
}
function updateSky(dt){
  smokeT-=dt;if(smokeT<=0){smokeT=0.35;smoke.push({x:(R()-.5)*6,y:0,r:horizon0*0.03,life:7,max:7})}
  for(let i=smoke.length-1;i>=0;i--){const p=smoke[i];p.life-=dt;if(p.life<=0){smoke.splice(i,1);continue}p.y-=horizon0*0.025*dt;p.x+=horizon0*0.018*dt;p.r+=horizon0*0.012*dt}
  for(const p of pteros){p.x+=p.v*dt;if(p.x>W+60)p.x=-60;if(p.x<-60)p.x=W+60}
  for(const m of motes){
    if(m.leaf){m.y+=(18+m.s*6)*dt;m.x+=Math.sin(T*1.2+m.ph)*22*dt;m.rot+=m.vr*dt}
    else{m.x+=(m.vx+Math.sin(T*0.7+m.ph)*6)*dt;m.y+=(m.vy*0.4+Math.cos(T*0.5+m.ph)*4)*dt}
    if(m.y>H+10){m.y=-10;m.x=R()*W}if(m.y<-10)m.y=H;if(m.x<-10)m.x=W+10;if(m.x>W+10)m.x=-10;
  }
}
function drawSky(){
  const oy=hz-horizon0;

    const g=ctx.createRadialGradient(x,y,0,x,y,p.r);g.addColorStop(0,`rgba(70,56,62,${a})`);g.addColorStop(1,'rgba(70,56,62,0)');ctx.fillStyle=g;ctx.fillRect(x-p.r,y-p.r,p.r*2,p.r*2)}

let AC=null,master=null,noiseBuf=null,muted=false,windG=null,ambT=0;
try{muted=localStorage.getItem(MUTE_KEY)==='1'}catch(e){}
function initAudio(){
  if(AC){if(AC.state!=='running'&&!document.hidden)AC.resume().catch(()=>{});return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  if(AC.state!=='running')AC.resume().catch(()=>{});
  // iOS: a sound started inside the first tap unlocks audio for the whole session
  try{const sb=AC.createBufferSource();sb.buffer=AC.createBuffer(1,1,22050);sb.connect(AC.destination);sb.start(0)}catch(e){}
  master=AC.createGain();master.gain.value=muted?0:0.9;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;
  // wind through leaves: soft band-limited noise that swells in gusts
  const ws=AC.createBufferSource();ws.buffer=noiseBuf;ws.loop=true;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=850;bp.Q.value=0.45;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;

function out(pan){

function blip(type,f0,f1,t0,dur,vol,pan,mid){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t0);
  if(mid){o.frequency.exponentialRampToValueAtTime(mid,t0+dur*0.45)}o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+Math.min(0.02,dur*0.2));g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(out(pan));o.start(t0);o.stop(t0+dur+0.05);return o;
}

const deathSounds=DEATH_URLS.map(u=>{const a=new Audio(u);a.preload='auto';a.setAttribute('playsinline','');return a});
const deathBufs=[];
function loadDeathBuffers(){
  // WebAudio buffers play reliably on iOS/Android even when the kill happens a moment after the tap
  DEATH_URLS.forEach((u,i)=>fetch(u).then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(ab=>new Promise((ok,no)=>{const p=AC.decodeAudioData(ab,ok,no);if(p&&p.then)p.then(ok,no)})).then(b=>{deathBufs[i]=b}).catch(()=>{}));
}
let deathBag=[];
function playDeath(){
  if(muted)return;if(!deathBag.length)deathBag=shuffle([...Array(9).keys()]);const i=deathBag.pop();
  if(AC&&deathBufs[i]){const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=1.1;s.buffer=deathBufs[i];s.connect(g).connect(master);s.start();return}
  const a=deathSounds[i];try{a.currentTime=0;a.volume=1;a.play().catch(()=>{})}catch(e){}
}
const buzz=p=>{try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}};
function setMute(m){muted=m;$('mute').classList.toggle('off',m);if(master)master.gain.value=m?0:0.9;try{localStorage.setItem(MUTE_KEY,m?'1':'0')}catch(e){}}

// ---------- game state ----------
const G={phase:'menu',hp:3,med:0,rage:0,kills:0,enemy:null,parry:new Set()};
let camZ=0,walk=null,bob=0,bobPh=0,ptr=null;
function later(s,fn){timers.push({t:T+s,fn})}
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return s&&s.kills?s:null}catch(e){return null}}
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({v:1,level:1,kills:G.kills,hp:G.hp,med:G.med,rage:G.rage}))}catch(e){}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}

function setPhase(p){
  G.phase=p;const b=document.body.classList;
  b.toggle('defend',p==='defend');b.toggle('rage',p==='rage');
  b.toggle('busy',!(p==='attack'||p==='defend'));
  b.toggle('screen',p==='menu'||p==='over'||p==='win');
  $('hint').textContent={attack:'Выбери удар 1–9',defend:'Враг замахнулся! Угадай ряд удара',rage:'ЯРОСТЬ! Руби пальцем по экрану',walk:''}[p]||'';
  updateHUD();
}
function updateHUD(){
  const hp=$('hp');[...hp.children].forEach((el,i)=>el.classList.toggle('on',i<G.hp));hp.classList.toggle('low',G.hp<=1);
  const rb=$('rbar');[...rb.children].forEach((el,i)=>el.classList.toggle('on',i<G.rage));rb.classList.toggle('full',G.rage>=RAGE_MAX);
  $('rage').classList.toggle('ready',G.rage>=RAGE_MAX&&G.phase==='attack');
  $('counter').textContent='☠ '+G.kills+'/'+TOTAL;
  $('medN').textContent=G.med;$('med').classList.toggle('none',G.med<=0||G.hp>=3);
}
let msgTimer=0;

function newGame(fromSave){
  initAudio();goFullscreen();
  G.hp=3;G.med=0;G.rage=0;G.kills=0;G.enemy=null;
  if(fromSave){const s=loadSave();if(s){G.hp=clamp(s.hp|0,1,3);G.med=s.med|0;G.rage=s.rage|0;G.kills=s.kills|0}}
  else clearSave();
  pieces=[];particles=[];slashes=[];timers=[];strike=null;sword.mode='rest';
  setPhase('walk');spawnNext();
}
function spawnNext(){
  const i=G.kills,T0=TYPES[i],r=rng(i*31+7),strands=[];
  for(let j=0;j<46;j++)strands.push([-0.28+r()*0.6,-1.45+r()*0.9,(r()-.5)*0.04,0.05+r()*0.06,r()<.4]);
  G.enemy={idx:i,type:T0,hp:T0.boss?2:1,maxHp:T0.boss?2:1,worldZ:camZ+FIGHT_Z+12,lunge:0,lungeT:0,flinch:0,flDir:1,pose:'idle',p:{hx:0.12,hy:-1.03,a:-2.05},cuts:[],rageCuts:0,strands};
  walk={from:camZ,to:G.enemy.worldZ-FIGHT_Z,t:0,dur:2.3};
  setPhase('walk');
  later(0.5,()=>showMsg(T0.boss?'ВОЖДЬ':'ВРАГ '+(i+1),T0.boss?'#ff6a3a':'#f3e7cc'));
}
function startAttack(){
  const e=G.enemy;if(!e)return;
  e.pose='idle';e.lungeT=0;sword.mode='rest';
  const k=e.idx<4?4:(R()<.5?4:5);
  G.parry=new Set(shuffle([1,2,3,4,5,6,7,8,9]).slice(0,k));
  setPhase('attack');
}
function onStrike(n){
  if(G.phase!=='attack'||!G.enemy)return;initAudio();
  const e=G.enemy,parried=G.parry.has(n);
  setPhase('anim');flashKey(`.k[data-n="${n}"]`,parried?'bad':'good');
  const zp=zonePt(n),cen=l2s(e,zp.x,zp.y);
  let S,E,keys;const rp=restPose(T);
  if(n===5){S=l2s(e,zp.x+0.15,zp.y+0.35);E=l2s(e,zp.x,zp.y)}
  else{const d=dirOf(n);S=l2s(e,zp.x-d.x*0.62,zp.y-d.y*0.62);E=l2s(e,zp.x+d.x*0.62,zp.y+d.y*0.62)}
  const cur={x:sword.tx,y:sword.ty};
  if(parried){const B={x:lerp(cen.x,S.x,0.45),y:lerp(cen.y,S.y,0.45)};keys=[[0,cur],[0.09,S],[0.2,cen],[0.32,B],[0.55,{x:rp.tx,y:rp.ty}]];later(0.08,()=>{e.pose='parry';e.pz=n})}
  else keys=n===5?[[0,cur],[0.1,S],[0.2,E],[0.3,E],[0.5,{x:rp.tx,y:rp.ty}]]:[[0,cur],[0.09,S],[0.28,E],[0.5,{x:rp.tx,y:rp.ty}]];
  strike={n,t:0,keys,contact:parried?0.2:(n===5?0.2:0.18),hit:false,parried,cen,S,E,dur:keys[keys.length-1][0]};
  sword.mode='strike';trail=[];sfx.swing();
}
function strikeContact(s){
  const e=G.enemy;if(!e)return;
  if(s.parried){
    burst(s.cen.x,s.cen.y,10,'spark');burst(s.cen.x,s.cen.y,16,'chip');sfx.knock();shake=Math.max(shake,6);buzz(25);
    showMsg('ОТБИЛ!','#ff9a5a');
    later(0.6,enemyTurn);
  }else{
    e.hp--;sfx.hit();buzz(35);e.flinch=1;e.flDir=s.n===5?(R()<.5?1:-1):(Math.sign(s.E.x-s.S.x)||1);shake=Math.max(shake,5);
    const zp=zonePt(s.n),d=s.n===5?{x:0.7,y:0.7}:dirOf(s.n);
    if(s.n===5){e.cuts.push({x0:zp.x-0.07,y0:zp.y-0.07,x1:zp.x+0.07,y1:zp.y+0.07,life:1},{x0:zp.x+0.07,y0:zp.y-0.07,x1:zp.x-0.07,y1:zp.y+0.07,life:1})}
    else e.cuts.push({x0:zp.x-d.x*0.22,y0:zp.y-d.y*0.22,x1:zp.x+d.x*0.22,y1:zp.y+d.y*0.22,life:1});
    burst(s.cen.x,s.cen.y,22,'blood',{x:d.x,y:d.y},2.2);
    G.rage=Math.min(RAGE_MAX,G.rage+1);
    if(e.hp<=0){later(0.12,()=>kill(s.n===5?{x:Math.SQRT1_2,y:-Math.SQRT1_2}:d,s.cen))}
    else{showMsg('ПОПАЛ!','#b9e27e');later(0.55,startAttack)}
    updateHUD();
  }
}
function enemyTurn(){const e=G.enemy;if(!e)return;e.pose='windup';setPhase('defend')}
function onRow(r){
  if(G.phase!=='defend'||!G.enemy)return;initAudio();
  const e=G.enemy,ar=ri(3);e.ar=ar;setPhase('anim');
  sword.mode='block';sword.row=r;
  later(0.14,()=>{e.pose='attack';e.lungeT=0.9;sfx.swing()});
  later(0.3,()=>{
    if(r===ar){
      const p={x:cx-0.05*viewH,y:rowY(r)};burst(p.x,p.y,12,'spark');burst(p.x,p.y,20,'chip');sfx.knock();buzz(30);shake=Math.max(shake,8);
      flashKey(`.r[data-r="${r}"]`,'good');showMsg('БЛОК!','#f3e7cc');
      G.rage=Math.min(RAGE_MAX,G.rage+1);
    }else{
      G.hp--;sfx.hurt();buzz([70,40,120]);shake=18;flash={col:'200,20,30',a:0.55};
      slashes.push({y:rowY(ar),life:0.45,max:0.45,col:'#b0141f',w:26});
      flashKey(`.r[data-r="${r}"]`,'bad');showMsg('−⅓ · '+ROWNAME[ar],'#ff5a5a');
    }
    updateHUD();
    later(0.55,()=>{if(!G.enemy)return;e.lungeT=0;if(G.hp<=0)gameOver();else startAttack()});
  });
}
function kill(dir,c){
  const e=G.enemy;if(!e)return;
  splitEnemy(e,dir,c);playDeath();sfx.slash();buzz(80);shake=Math.max(shake,10);
  G.enemy=null;G.kills++;setPhase('anim');
  showMsg(G.kills>=TOTAL?'ПОБЕДА':'ПОВЕРЖЕН','#ff6a3a');
  if(G.kills%3===0&&G.kills<TOTAL){G.med++;later(0.7,()=>{toast('+1 АПТЕЧКА');sfx.heal()})}
  if(G.kills===6){writeSave();later(1.5,()=>toast('АВТОСОХРАНЕНИЕ'))}
  updateHUD();
  if(G.kills>=TOTAL)later(2,victory);else later(1.5,spawnNext);
}
function useMed(){
  if(G.med<=0||G.hp>=3||!(G.phase==='attack'||G.phase==='defend'||G.phase==='walk'))return;
  initAudio();G.med--;G.hp++;sfx.heal();flash={col:'139,195,74',a:0.35};toast('+⅓ ЖИЗНИ');updateHUD();
}
function startRage(){
  if(G.phase!=='attack'||G.rage<RAGE_MAX||!G.enemy)return;initAudio();
  G.rage=0;const e=G.enemy;e.pose='stagger';e.rageCuts=0;e.rageNeed=e.type.boss?7:5;
  sfx.rage();shake=12;flash={col:'255,110,30',a:0.5};showMsg('ЯРОСТЬ!','#ff7a2a');setPhase('rage');trail=[];
}
function rageCut(dir,c){
  const e=G.enemy;if(!e||G.phase!=='rage')return;
  e.rageCuts++;sfx.slash();buzz(25);e.flinch=1;e.flDir=Math.sign(dir.x)||1;shake=Math.max(shake,6);
  const a=s2l(e,c.x-dir.x*40,c.y-dir.y*40),b=s2l(e,c.x+dir.x*40,c.y+dir.y*40);
  e.cuts.push({x0:a.x/e.type.k,y0:a.y/e.type.k,x1:b.x/e.type.k,y1:b.y/e.type.k,life:1});
  burst(c.x,c.y,18,'blood',dir,2.4);burst(c.x,c.y,8,'chip',dir,1.2);
  if(e.rageCuts>=e.rageNeed){ptr=null;kill(dir,c)}
}

// ---------- update ----------
function update(dt){
  T+=dt;
  for(let i=timers.length-1;i>=0;i--)if(timers[i].t<=T){const f=timers[i].fn;timers.splice(i,1);f()}
  let moving=0;
  if(G.phase==='menu'||G.phase==='over'||G.phase==='win'){camZ+=dt*1.3;moving=0.35}
  if(walk){
    walk.t+=dt/walk.dur;const k=clamp(walk.t,0,1);camZ=lerp(walk.from,walk.to,easeIO(k));moving=Math.sin(k*Math.PI);
    if(walk.t>=1){walk=null;startAttack()}
  }
  const prevPh=bobPh;bobPh+=dt*9*moving;bob=Math.sin(bobPh)*5*moving;
  if(moving>0.3&&G.phase==='walk'&&Math.floor(prevPh/Math.PI)!==Math.floor(bobPh/Math.PI))sfx.step();
  hz=horizon0+bob;
  const e=G.enemy;
  if(e){
    const tg=poseTarget(e,T),k=1-Math.exp(-dt*tg.rate);
    e.p.hx=lerp(e.p.hx,tg.hx,k);e.p.hy=lerp(e.p.hy,tg.hy,k);e.p.a=angLerp(e.p.a,tg.a,k);
    e.flinch=Math.max(0,e.flinch-dt*3.5);e.lunge=lerp(e.lunge,e.lungeT,1-Math.exp(-dt*14));
    for(const m of e.cuts)m.life=Math.max(0.55,m.life-dt);
  }
  if(!sword.init){const r=restPose(T);Object.assign(sword,r);sword.init=true}
  if(strike){
    strike.t+=dt;const ks=strike.keys,t=Math.min(strike.t,strike.dur);
    let i=1;while(i<ks.length-1&&ks[i][0]<t)i++;
    const a=ks[i-1],b=ks[i],u=easeOut(clamp((t-a[0])/((b[0]-a[0])||1),0,1));
    sword.tx=lerp(a[1].x,b[1].x,u);sword.ty=lerp(a[1].y,b[1].y,u);
    const h=hiltFor(sword.tx,sword.ty);sword.hx=h.x;sword.hy=h.y;
    trail.push({x:sword.tx,y:sword.ty,t:T});
    if(!strike.hit&&strike.t>=strike.contact){strike.hit=true;strikeContact(strike)}
    if(strike.t>=strike.dur){strike=null;if(sword.mode==='strike')sword.mode='rest'}
  }else{
    const tg=sword.mode==='block'?blockPose(sword.row):restPose(T),k=1-Math.exp(-dt*(sword.mode==='block'?30:10));
    sword.hx=lerp(sword.hx,tg.hx,k);sword.hy=lerp(sword.hy,tg.hy,k);sword.tx=lerp(sword.tx,tg.tx,k);sword.ty=lerp(sword.ty,tg.ty,k);
  }
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}
    p.vy+=(p.kind==='spark'?500:1100)*dt;p.vx*=1-dt*1.5;p.x+=p.vx*dt;p.y+=p.vy*dt}
  for(let i=pieces.length-1;i>=0;i--){const p=pieces[i];p.life-=dt;if(p.life<=0){pieces.splice(i,1);continue}
    p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}
  for(let i=slashes.length-1;i>=0;i--){slashes[i].life-=dt;if(slashes[i].life<=0)slashes.splice(i,1)}
  if(trail.length>40)trail.splice(0,trail.length-40);
  shake=Math.max(0,shake-dt*45);
  if(flash){flash.a-=dt*1.4;if(flash.a<=0)flash=null}
  updateSky(dt);
}

// ---------- render ----------
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#1a120c';ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>0.3)ctx.translate((R()-.5)*shake,(R()-.5)*shake);
  ctx.fillStyle='#24304f';ctx.fillRect(0,0,W,Math.max(0,hz-horizon0)+1);
  ctx.drawImage(bg,0,hz-horizon0,W,bg.height/DPR);
  drawSky();
  drawWorld(T);
  drawPieces();
  drawParticles();
  drawSlashes();
  drawMotes();
  if(G.phase!=='rage'&&G.phase!=='menu'&&G.phase!=='over'&&G.phase!=='win')drawAxe(sword.hx,sword.hy,sword.tx,sword.ty);
  drawTrail();
  ctx.restore();
  // warm sun bloom over everything
  const sy=sun.y+hz-horizon0,bl=ctx.createRadialGradient(sun.x,sy,0,sun.x,sy,horizon0*1.4);
  bl.addColorStop(0,'rgba(255,200,120,.28)');bl.addColorStop(1,'rgba(255,160,80,0)');
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=bl;ctx.fillRect(0,0,W,H);ctx.restore();
  ctx.drawImage(vign,0,0,W,H);
  if(G.phase==='rage'){const a=0.18+Math.sin(T*8)*0.06;const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.2,W/2,H/2,Math.max(W,H)*0.75);g.addColorStop(0,'rgba(255,60,0,0)');g.addColorStop(1,`rgba(220,40,0,${a+0.25})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  if(flash){ctx.fillStyle=`rgba(${flash.col},${flash.a})`;ctx.fillRect(0,0,W,H)}
}
let last=performance.now(),slowT=0;
function frame(now){
  const raw=(now-last)/1000,dt=Math.min(0.05,raw);last=now;
  // weak phones: if we keep missing ~40fps, drop render resolution a notch
  if(raw<0.2&&!document.hidden){slowT=raw>0.026?slowT+raw:Math.max(0,slowT-raw*0.5);
    if(slowT>2.5&&dprCap>1){dprCap=Math.max(1,Math.min(dprCap,window.devicePixelRatio||1)-0.5);slowT=0;resize();initSky()}}
  update(dt);render();requestAnimationFrame(frame);
}

function clipSeg(x0,y0,x1,y1,r){
  let t0=0,t1=1;const dx=x1-x0,dy=y1-y0;
  const p=[-dx,dx,-dy,dy],q=[x0-r.x0,r.x1-x0,y0-r.y0,r.y1-y0];
  for(let i=0;i<4;i++){if(p[i]===0){if(q[i]<0)return null}else{const t=q[i]/p[i];if(p[i]<0){if(t>t1)return null;if(t>t0)t0=t}else{if(t<t0)return null;if(t<t1)t1=t}}}
  return{ax:x0+dx*t0,ay:y0+dy*t0,bx:x0+dx*t1,by:y0+dy*t1,len:Math.hypot(dx,dy)*(t1-t0)};
}
cv.addEventListener('pointerdown',ev=>{if(G.phase!=='rage')return;ptr={x:ev.clientX,y:ev.clientY,acc:0,enter:null,last:0};trail.push({x:ev.clientX,y:ev.clientY,t:T});try{cv.setPointerCapture(ev.pointerId)}catch(e){}});
cv.addEventListener('pointermove',ev=>{
  if(!ptr||G.phase!=='rage'||!G.enemy)return;
  const x=ev.clientX,y=ev.clientY;trail.push({x,y,t:T});
  const q=enemyScreen(G.enemy),rect={x0:q.sx-0.42*q.sk,x1:q.sx+0.42*q.sk,y0:q.fy-1.85*q.sk,y1:q.fy-0.1*q.sk};
  const c=clipSeg(ptr.x,ptr.y,x,y,rect);
  if(c&&c.len>0){if(!ptr.enter)ptr.enter={x:c.ax,y:c.ay};ptr.acc+=c.len;
    if(ptr.acc>(rect.x1-rect.x0)*0.5&&T-ptr.last>0.1){
      const dx=c.bx-ptr.enter.x,dy=c.by-ptr.enter.y,l=Math.hypot(dx,dy)||1;
      rageCut({x:dx/l,y:dy/l},{x:(ptr.enter.x+c.bx)/2,y:(ptr.enter.y+c.by)/2});
      if(ptr){ptr.acc=0;ptr.enter=null;ptr.last=T}
    }
  }else if(ptr.enter&&!c){ptr.acc=0;ptr.enter=null}
  if(ptr){ptr.x=x;ptr.y=y}
});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{ptr=null}));
